<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Africa Safari Route Map</title>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
 <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
 <style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .legend-box {
   position: absolute; right: 14px; bottom: 14px; z-index: 1000;
   background: rgba(255,255,255,0.96); padding: 12px 14px; border-radius: 14px;
   box-shadow: 0 6px 20px rgba(0,0,0,0.12); min-width: 230px;
   font-size: 12.5px; color: #243b53; line-height: 1.5;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend-line { width: 32px; height: 4px; background: #c6a545; border-radius: 999px; flex: 0 0 auto; }
  .legend-line.air {
   height: 3px; border-radius: 0;
   background: repeating-linear-gradient(to right, #123b63 0 7px, transparent 7px 13px);
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; background: #123b63; border: 2px solid #fff; box-shadow: 0 0 0 2px #123b63; flex: 0 0 auto; }
  .legend-waypoint { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 3px solid #c6a545; flex: 0 0 auto; }
  .major-label {
   background: rgba(255,255,255,0.94); border: 1px solid rgba(18,59,99,0.10);
   border-radius: 999px; padding: 4px 10px; color: #123b63; font-weight: 700;
   font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .minor-label {
   background: rgba(255,255,255,0.92); border: 1px solid rgba(198,165,69,0.25);
   border-radius: 999px; padding: 3px 9px; color: #7a6220; font-weight: 700;
   font-size: 11.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
 </style>
</head>
<body>
 <div id="map"></div>
 <div class="legend-box">
  <div class="legend-row"><span class="legend-dot"></span><span>숙박 / 메인 베이스</span></div>
  <div class="legend-row"><span class="legend-waypoint"></span><span>경유 / 핵심 루트 포인트</span></div>
  <div class="legend-row"><span class="legend-line"></span><span>차량 이동 / 사파리</span></div>
  <div class="legend-row"><span class="legend-line air"></span><span>항공 / 전세기 이동</span></div>
 </div>

 <script>
  const map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
   attribution: '&copy; OpenStreetMap contributors &copy; CARTO', subdomains: 'abcd', maxZoom: 20
  }).addTo(map);

  const majorStyle = { radius: 10, color: '#ffffff', weight: 3, fillColor: '#123b63', fillOpacity: 1 };
  const minorStyle = { radius: 6, color: '#c6a545', weight: 3, fillColor: '#ffffff', fillOpacity: 1 };

  const majorStops = [
   { name: 'Nairobi', lat: -1.2864, lng: 36.8172, day: 'Day 1', note: '케냐 도착 / 나이로비 1박' },
   { name: 'Kilimanjaro', lat: -3.4294, lng: 37.0745, day: 'Day 2', note: '킬리만자로 1박' },
   { name: 'Ngorongoro', lat: -3.1618, lng: 35.5877, day: 'Day 3–4', note: '코티지형 사파리 리조트 / 2박' },
   { name: 'Serengeti', lat: -2.3333, lng: 34.8333, day: 'Day 5–7', note: '텐트형 사파리 리조트 / 3박' },
   { name: 'Zanzibar', lat: -6.1659, lng: 39.2026, day: 'Day 8–9', note: '잔지바르 1박 / 도하행 출발' }
  ];

  const minorStops = [
   { name: 'Arusha', lat: -3.3869, lng: 36.6830, day: 'Day 8', note: '세렝게티 → 잔지바르 항공 경유' }
  ];

  const airRoutes = [
   { label: 'Day 2: Nairobi → Kilimanjaro', points: [[-1.2864, 36.8172], [-3.4294, 37.0745]] },
   { label: 'Day 3: Kilimanjaro → Ngorongoro (charter flight)', points: [[-3.4294, 37.0745], [-3.1618, 35.5877]] },
   { label: 'Day 5: Ngorongoro → Serengeti (charter flight)', points: [[-3.1618, 35.5877], [-2.3333, 34.8333]] },
   { label: 'Day 8: Serengeti → Arusha → Zanzibar (charter flight)', points: [[-2.3333, 34.8333], [-3.3869, 36.6830], [-6.1659, 39.2026]] }
  ];

  const safariRoutes = [
   { label: 'Ngorongoro safari area', points: [[-3.1618, 35.5877], [-3.2100, 35.5000], [-3.2600, 35.6100], [-3.1618, 35.5877]] },
   { label: 'Serengeti safari area', points: [[-2.3333, 34.8333], [-2.1500, 34.6500], [-2.5500, 34.7000], [-2.3333, 34.8333]] }
  ];

  const airOptions = { color: '#123b63', weight: 4, opacity: 0.78, dashArray: '7,9', lineCap: 'round', lineJoin: 'round' };
  const carOptions = { color: '#c6a545', weight: 5, opacity: 0.86, lineCap: 'round', lineJoin: 'round' };

  airRoutes.forEach(route => L.polyline(route.points, airOptions).bindTooltip(route.label).addTo(map));
  safariRoutes.forEach(route => L.polyline(route.points, carOptions).bindTooltip(route.label).addTo(map));

  majorStops.forEach(stop => {
   L.circleMarker([stop.lat, stop.lng], majorStyle)
    .addTo(map)
    .bindPopup(`<b>${stop.day}</b><br>${stop.name}<br><span style="font-size:12px;color:#666;">${stop.note}</span>`)
    .bindTooltip(`${stop.day} · ${stop.name}`, { permanent: true, direction: 'top', offset: [0, -12], className: 'major-label' });
  });

  minorStops.forEach(stop => {
   L.circleMarker([stop.lat, stop.lng], minorStyle)
    .addTo(map)
    .bindPopup(`<b>${stop.day}</b><br>${stop.name}<br><span style="font-size:12px;color:#666;">${stop.note}</span>`)
    .bindTooltip(stop.name, { permanent: true, direction: 'right', offset: [10, 0], className: 'minor-label' });
  });

  const bounds = L.latLngBounds([...majorStops.map(s => [s.lat, s.lng]), ...minorStops.map(s => [s.lat, s.lng])]);
  map.fitBounds(bounds.pad(0.22));
 </script>
</body>
</html>
